# Bruteon: generated by tools/gen-themes.py.
add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold #f28b82)"
success_symbol = "[❯](bold #f4a07a)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold #a8dcd9"
repo_root_style = "bold #a8dcd9"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #d8b4f8"

[git_status]
format     = '[$all_status]($style)'
style      = "#f7d38a"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
