# Lavender: generated by tools/gen-themes.py.
add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold #c75f7f)"
success_symbol = "[❯](bold #9988cb)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold #5f9aa8"
repo_root_style = "bold #5f9aa8"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #a06fb5"

[git_status]
format     = '[$all_status]($style)'
style      = "#c9a95a"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
