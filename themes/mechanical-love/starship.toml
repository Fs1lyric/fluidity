# Mechanical Love: generated by tools/gen-themes.py.
add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold #f37f97)"
success_symbol = "[❯](bold #c574dd)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold #79e6f3"
repo_root_style = "bold #79e6f3"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #c574dd"

[git_status]
format     = '[$all_status]($style)'
style      = "#f2a272"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
