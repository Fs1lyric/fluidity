# Pixel Clock: generated by tools/gen-themes.py.
add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold #e46876)"
success_symbol = "[❯](bold #cba6f7)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold #7aa89f"
repo_root_style = "bold #7aa89f"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #938aa9"

[git_status]
format     = '[$all_status]($style)'
style      = "#e6c384"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
