# Neon 80s: generated by tools/gen-themes.py.
add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold #ff2a6d)"
success_symbol = "[❯](bold #ff16b0)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold #2de2e6"
repo_root_style = "bold #2de2e6"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #ff16b0"

[git_status]
format     = '[$all_status]($style)'
style      = "#f9f871"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
