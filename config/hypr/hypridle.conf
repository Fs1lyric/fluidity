# Fluidity idle: dim at 4 min, lock at 5, screen off at 10. Stay awake (leader i) pauses all of it.
general {
    lock_cmd = fluidity-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    inhibit_sleep = 3
}
listener {
    timeout = 240
    on-timeout = fluidity-shell brightness set 20
    on-resume = fluidity-shell brightness set 100
}
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
