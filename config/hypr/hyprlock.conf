# Fluidity lock screen, Liquid: your wallpaper blurred, the huge italic serif clock with the accent colon,
# the date, and a glass pill for the password. Colours come from the current theme (fluidity-theme writes them).
source = ~/.cache/fluidity/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/state/fluidity/current-wallpaper
    blur_passes = 3
    blur_size = 10
    brightness = 0.55
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H)<span foreground='##$accent_hex'>:</span>$(date +%M)"
    color = $fg
    font_size = 190
    font_family = Instrument Serif Italic
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A,') <i><span foreground='##$accent_hex'>$(date +'%-d %B')</span></i>"
    color = $fg
    font_size = 26
    font_family = Instrument Serif
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 56
    rounding = -1
    outline_thickness = 2
    outer_color = $accent $cyan 45deg
    inner_color = rgba(0a0c0ed9)
    font_color = $fg
    font_family = Geist
    placeholder_text = <span foreground='##$dim_hex'>password</span>
    check_color = $cyan
    fail_color = $red
    fail_text = <i>try again</i>
    dots_size = 0.22
    dots_spacing = 0.4
    fade_on_empty = false
    position = 0, -130
    halign = center
    valign = center
}

label {
    monitor =
    text = // stay fluid.
    color = $dim
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
